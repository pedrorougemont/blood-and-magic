<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blood &amp; Magic (1996) — Browser-Native Prototype</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-badge">DOS 1996 PORT</span>
      <h1>Blood &amp; Magic</h1>
      <span class="subtitle" id="stageSubtitle">Storyline 1: Howl of Vengeance — Stage 1</span>
    </div>
    <div class="toolbar">
      <label class="ctrl-label">
        Stage:
        <select id="mapSelect" title="Choose Campaign Stage">
          <option value="9110">Map 9110 — Doegan Keep vs. Horath's Crypt (Aeldric)</option>
          <option value="9155">Map 9155 — Old Stone Keep vs. Barracks (Horath)</option>
        </select>
      </label>
      <button id="btnRestart" class="tb-btn" title="Restart current stage">Restart</button>
      <button id="btnFog" class="tb-btn active" title="Toggle Fog of War (F)">Fog: ON</button>
      <button id="btnBoost" class="tb-btn" title="Grant +100 Mana &amp; +250 XP for testing">+Mana/XP</button>
      <button id="btnAudio" class="tb-btn active" title="Toggle Sound Effects">SFX: ON</button>
    </div>
  </header>

  <main class="workspace">
    <div class="viewport-shell">
      <div class="canvas-frame" id="canvasFrame">
        <canvas id="bamCanvas" width="640" height="400"></canvas>
        <div id="loadingOverlay" class="overlay">
          <div class="loader-box">
            <h2>LOADING BLOOD &amp; MAGIC ARCHIVES...</h2>
            <p id="loadingStatus">Reading palettes, 9100.TLB tileset, 9110.MIF map, and 747 sprite animations...</p>
          </div>
        </div>
        <div id="victoryOverlay" class="overlay hidden">
          <div class="loader-box victory-box">
            <h2 id="victoryTitle">VICTORY!</h2>
            <p id="victoryDesc">You have conquered the realm!</p>
            <div class="victory-actions">
              <button id="btnPlayAgain" class="tb-btn primary">Play Again</button>
              <button id="btnSwitchSide" class="tb-btn">Try Other Side</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script type="module" src="/game.js"></script>
</body>
</html>
